<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Door House Escape</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-outer: #040507;
        --bg-inner: #12161c;
        --panel: rgba(10, 12, 16, 0.72);
        --border: rgba(228, 237, 255, 0.12);
        --text: #eef3ff;
        --danger: #ff5d73;
        --accent: #d6b65e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(114, 27, 38, 0.32), transparent 30%),
          radial-gradient(circle at bottom, rgba(46, 66, 84, 0.28), transparent 32%),
          linear-gradient(180deg, var(--bg-inner), var(--bg-outer));
        font-family: "Trebuchet MS", Verdana, sans-serif;
        color: var(--text);
      }

      .frame {
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      canvas {
        width: min(800px, calc(100vw - 24px));
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #050608;
        border: 2px solid var(--border);
        box-shadow:
          0 22px 60px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      }

      .hint {
        padding: 10px 14px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-size: 14px;
        letter-spacing: 0.03em;
        text-align: center;
      }

      .hint strong {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <canvas id="game" width="800" height="600" aria-label="Door House Escape"></canvas>
      <div class="hint">
        Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move. Grab the key, reach the stairs,
        and press <strong>Spacebar</strong> after defeat to retry.
      </div>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
