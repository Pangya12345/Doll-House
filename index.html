<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Door House Escape</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-outer: #040507;
        --bg-inner: #12161c;
        --panel: rgba(10, 12, 16, 0.72);
        --border: rgba(228, 237, 255, 0.12);
        --text: #eef3ff;
        --danger: #ff5d73;
        --accent: #d6b65e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(114, 27, 38, 0.32), transparent 30%),
          radial-gradient(circle at bottom, rgba(46, 66, 84, 0.28), transparent 32%),
          linear-gradient(180deg, var(--bg-inner), var(--bg-outer));
        font-family: "Trebuchet MS", Verdana, sans-serif;
        color: var(--text);
      }

      .frame {
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      canvas {
        width: min(800px, calc(100vw - 24px));
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #050608;
        border: 2px solid var(--border);
        box-shadow:
          0 22px 60px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      }

      .hint {
        padding: 10px 14px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-size: 14px;
        letter-spacing: 0.03em;
        text-align: center;
      }

      .hint strong {
        color: var(--accent);
      }

      #dpad {
        display: none;
        grid-template-columns: repeat(3, 72px);
        grid-template-rows: repeat(3, 72px);
        gap: 18px;
        touch-action: none;
        user-select: none;
      }

      #dpad.visible {
        display: grid;
      }

      .touch-controls .hint {
        display: none;
      }

      .dpad-button {
        position: relative;
        border: 4px solid #30362f;
        border-radius: 0;
        background: rgba(131, 139, 126, 0.58);
        box-shadow:
          inset 4px 4px 0 rgba(236, 242, 218, 0.2),
          inset -4px -4px 0 rgba(22, 28, 20, 0.34),
          0 0 0 3px rgba(16, 21, 16, 0.66),
          4px 4px 0 rgba(11, 15, 11, 0.7);
        color: #243321;
        cursor: pointer;
        font-size: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      .dpad-button::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        transform: translate(-50%, -50%);
        filter: drop-shadow(3px 3px 0 rgba(19, 28, 17, 0.34));
      }

      .dpad-button.up::before {
        border-left: 17px solid transparent;
        border-right: 17px solid transparent;
        border-bottom: 25px solid currentColor;
      }

      .dpad-button.down::before {
        border-left: 17px solid transparent;
        border-right: 17px solid transparent;
        border-top: 25px solid currentColor;
      }

      .dpad-button.left::before {
        border-top: 17px solid transparent;
        border-bottom: 17px solid transparent;
        border-right: 25px solid currentColor;
      }

      .dpad-button.right::before {
        border-top: 17px solid transparent;
        border-bottom: 17px solid transparent;
        border-left: 25px solid currentColor;
      }

      .dpad-button:active,
      .dpad-button.pressed {
        background: rgba(155, 163, 147, 0.78);
        box-shadow:
          inset 3px 3px 0 rgba(22, 28, 20, 0.4),
          inset -3px -3px 0 rgba(236, 242, 218, 0.16),
          0 0 0 3px rgba(16, 21, 16, 0.66),
          2px 2px 0 rgba(11, 15, 11, 0.7);
        transform: translate(2px, 2px);
      }

      .dpad-button.up { grid-column: 2; grid-row: 1; }
      .dpad-button.left { grid-column: 1; grid-row: 2; }
      .dpad-button.right { grid-column: 3; grid-row: 2; }
      .dpad-button.down { grid-column: 2; grid-row: 3; }

      @media (max-width: 420px) {
        #dpad {
          grid-template-columns: repeat(3, 58px);
          grid-template-rows: repeat(3, 58px);
          gap: 14px;
        }
      }

      @media (orientation: landscape) and (max-height: 540px) {
        #dpad {
          position: fixed;
          right: 18px;
          bottom: 14px;
          transform: scale(0.78);
          transform-origin: bottom right;
        }
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <canvas id="game" width="800" height="600" aria-label="Door House Escape"></canvas>
      <div id="dpad" aria-label="Character movement controls">
        <button class="dpad-button up" type="button" data-direction="up" aria-label="Move up">▲</button>
        <button class="dpad-button left" type="button" data-direction="left" aria-label="Move left">◀</button>
        <button class="dpad-button right" type="button" data-direction="right" aria-label="Move right">▶</button>
        <button class="dpad-button down" type="button" data-direction="down" aria-label="Move down">▼</button>
      </div>
      <div id="control-hint" class="hint">
        Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move. Grab the key, reach the stairs,
        and press <strong>Spacebar</strong> after defeat to retry.
      </div>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
